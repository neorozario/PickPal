<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickPal - Your Decision Making Friend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #262424;
            color: #EEE5DA;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: #EEE5DA;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 24px;
            font-weight: bold;
            color: #262424;
            transform: rotate(-5deg);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #EEE5DA;
        }

        .tagline {
            color: #b3a9a0;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .suggestion-card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            border: 2px solid #EEE5DA;
        }

        .suggestion-card:hover {
            transform: translateY(-5px);
            border-color: #b3a9a0;
        }

        #decision-result {
            font-size: 2rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            color: #EEE5DA;
        }

        #decision-result.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .decision-button {
            background: #EEE5DA;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            color: #262424;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .decision-button:hover {
            transform: translateY(-2px);
            background: #b3a9a0;
            color: #EEE5DA;
        }

        .decision-button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #2d2d2d;
            border-top: 4px solid #EEE5DA;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .decision-category {
            font-size: 0.9rem;
            color: #b3a9a0;
            margin-top: 0.5rem;
        }

        .custom-input {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.8rem;
            border-radius: 10px;
            color: #EEE5DA;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            margin-top: 1rem;
            text-align: center;
        }

        .custom-input::placeholder {
            color: #b3a9a0;
        }

        .custom-input:focus {
            outline: none;
            border-color: #b3a9a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">P</div>
            <h1>PickPal</h1>
        </div>
        <div class="tagline">Your Decision Making Friend</div>
        <div class="suggestion-card">
            <div id="decision-result"></div>
        </div>
        <div class="loading" id="loading"></div>
        <div class="button-grid">
            <button class="decision-button" onclick="makeDecision('food')">What Should I Eat?</button>
            <button class="decision-button" onclick="makeDecision('yesno')">Yes or No?</button>
            <button class="decision-button" onclick="makeDecision('maybe')">Maybe?</button>
            <button class="decision-button" onclick="makeDecision('coin')">Flip a Coin</button>
            <button class="decision-button" onclick="makeDecision('dice')">Roll a Die</button>
            <button class="decision-button" onclick="makeDecision('custom')">Custom Decision</button>
        </div>
        <input type="text" id="custom-options" class="custom-input" placeholder="Enter options separated by commas" style="display: none;">
    </div>

    <script>
        const foods = [
            // South Indian
            { name: "Masala Dosa", category: "South Indian" },
            { name: "Idli Sambar", category: "South Indian" },
            { name: "Vada", category: "South Indian" },
            { name: "Upma", category: "South Indian" },
            { name: "Pongal", category: "South Indian" },
            { name: "Appam", category: "South Indian" },
            { name: "Rava Dosa", category: "South Indian" },
            { name: "Uttapam", category: "South Indian" },
            
            // North Indian
            { name: "Butter Chicken", category: "North Indian" },
            { name: "Dal Makhani", category: "North Indian" },
            { name: "Paneer Tikka", category: "North Indian" },
            { name: "Naan", category: "North Indian" },
            { name: "Biryani", category: "North Indian" },
            { name: "Tandoori Roti", category: "North Indian" },
            { name: "Rajma Chawal", category: "North Indian" },
            { name: "Chole Bhature", category: "North Indian" },
            
            // Chinese
            { name: "Fried Rice", category: "Chinese" },
            { name: "Chow Mein", category: "Chinese" },
            { name: "Spring Rolls", category: "Chinese" },
            { name: "Kung Pao Chicken", category: "Chinese" },
            { name: "Mapo Tofu", category: "Chinese" },
            { name: "Dim Sum", category: "Chinese" },
            { name: "Hot and Sour Soup", category: "Chinese" },
            { name: "Wontons", category: "Chinese" },
            
            // American
            { name: "Cheeseburger", category: "American" },
            { name: "Mac and Cheese", category: "American" },
            { name: "BBQ Ribs", category: "American" },
            { name: "Clam Chowder", category: "American" },
            { name: "Buffalo Wings", category: "American" },
            { name: "Philly Cheesesteak", category: "American" },
            { name: "Pot Roast", category: "American" },
            { name: "Cobb Salad", category: "American" },
            
            // Fast Food
            { name: "Pizza", category: "Fast Food" },
            { name: "Chicken Nuggets", category: "Fast Food" },
            { name: "French Fries", category: "Fast Food" },
            { name: "Tacos", category: "Fast Food" },
            { name: "Sub Sandwich", category: "Fast Food" },
            { name: "Chicken Sandwich", category: "Fast Food" },
            { name: "Onion Rings", category: "Fast Food" },
            { name: "Ice Cream", category: "Fast Food" }
        ];

        const yesNoResponses = [
            { name: "Yes", category: "Definitely!" },
            { name: "No", category: "Not this time" },
            { name: "Maybe", category: "Think about it" }
        ];

        const maybeResponses = [
            { name: "Probably", category: "Good chance" },
            { name: "Probably Not", category: "Unlikely" },
            { name: "Maybe", category: "50/50" }
        ];

        function makeDecision(type) {
            const resultElement = document.getElementById("decision-result");
            const loadingElement = document.getElementById("loading");
            const customInput = document.getElementById("custom-options");
            
            // Show loading animation
            resultElement.classList.remove("visible");
            loadingElement.style.display = "block";
            
            if (type === 'custom') {
                customInput.style.display = "block";
                loadingElement.style.display = "none";
                return;
            }
            
            // Simulate loading time
            setTimeout(() => {
                let result;
                switch(type) {
                    case 'food':
                        result = foods[Math.floor(Math.random() * foods.length)];
                        break;
                    case 'yesno':
                        result = yesNoResponses[Math.floor(Math.random() * yesNoResponses.length)];
                        break;
                    case 'maybe':
                        result = maybeResponses[Math.floor(Math.random() * maybeResponses.length)];
                        break;
                    case 'coin':
                        result = {
                            name: Math.random() < 0.5 ? "Heads" : "Tails",
                            category: "Coin Flip"
                        };
                        break;
                    case 'dice':
                        result = {
                            name: Math.floor(Math.random() * 6) + 1,
                            category: "Dice Roll"
                        };
                        break;
                }
                
                resultElement.innerHTML = `
                    ${result.name}
                    <div class="decision-category">${result.category}</div>
                `;
                
                // Hide loading and show result
                loadingElement.style.display = "none";
                resultElement.classList.add("visible");
            }, 800);
        }

        // Handle custom decision input
        document.getElementById("custom-options").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                const options = this.value.split(",").map(opt => opt.trim()).filter(opt => opt);
                if (options.length > 0) {
                    const randomOption = options[Math.floor(Math.random() * options.length)];
                    document.getElementById("decision-result").innerHTML = `
                        ${randomOption}
                        <div class="decision-category">Custom Decision</div>
                    `;
                    document.getElementById("decision-result").classList.add("visible");
                    this.style.display = "none";
                    this.value = "";
                }
            }
        });
    </script>
</body>
</html>
