<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickPal - Your Decision Making Friend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #262424;
            color: #EEE5DA;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .container {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
            margin: 60px auto 20px; /* Add top margin for theme switch */
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: #EEE5DA;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 24px;
            font-weight: bold;
            color: #262424;
            transform: rotate(-5deg);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #EEE5DA;
        }

        .tagline {
            color: #b3a9a0;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .suggestion-card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            border: 2px solid #EEE5DA;
        }

        .suggestion-card:hover {
            transform: translateY(-5px);
            border-color: #b3a9a0;
        }

        #decision-result {
            font-size: 2rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            color: #EEE5DA;
        }

        #decision-result.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .decision-button {
            background: #EEE5DA;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            color: #262424;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .decision-button:hover {
            transform: translateY(-2px);
            background: #b3a9a0;
            color: #EEE5DA;
        }

        .decision-button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #2d2d2d;
            border-top: 4px solid #EEE5DA;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .decision-category {
            font-size: 0.9rem;
            color: #b3a9a0;
            margin-top: 0.5rem;
        }

        .custom-input {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.8rem;
            border-radius: 10px;
            color: #EEE5DA;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            margin-top: 1rem;
            text-align: center;
        }

        .custom-input::placeholder {
            color: #b3a9a0;
        }

        .custom-input:focus {
            outline: none;
            border-color: #b3a9a0;
        }

        .time-display {
            font-size: 1.2rem;
            color: #b3a9a0;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .time-period {
            color: #EEE5DA;
            font-weight: 600;
        }

        .filter-container {
            display: none;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin: 1rem 0;
            padding: 1rem;
            background: #2d2d2d;
            border-radius: 15px;
            border: 2px solid #EEE5DA;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }

        .filter-button {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: #EEE5DA;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-button:hover {
            background: #EEE5DA;
            color: #262424;
        }

        .filter-button.active {
            background: #EEE5DA;
            color: #262424;
        }

        .filter-label {
            color: #b3a9a0;
            font-size: 0.9rem;
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .food-options {
            display: none;
            margin-top: 1rem;
        }

        .food-options.visible {
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .decision-button {
            position: relative;
        }

        .decision-button.active {
            background: #b3a9a0;
            color: #EEE5DA;
        }

        .location-button {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: #EEE5DA;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .location-button:hover {
            background: #EEE5DA;
            color: #262424;
        }

        .location-button i {
            font-size: 1rem;
        }

        .restaurant-card {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            border-radius: 15px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: left;
        }

        .restaurant-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #EEE5DA;
            margin-bottom: 0.5rem;
        }

        .restaurant-details {
            font-size: 0.9rem;
            color: #b3a9a0;
            margin-bottom: 0.5rem;
        }

        .restaurant-rating {
            color: #EEE5DA;
            font-weight: 500;
        }

        .restaurant-price {
            color: #b3a9a0;
            font-size: 0.9rem;
        }

        .location-error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Theme Toggle Styles */
        .theme-switch-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .theme-switch {
            display: inline-block;
            height: 34px;
            position: relative;
            width: 60px;
        }

        .theme-switch input {
            display: none;
        }

        .slider {
            background-color: #2d2d2d;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
            border: 2px solid #EEE5DA;
        }

        .slider:before {
            background-color: #EEE5DA;
            bottom: 4px;
            content: "";
            height: 26px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 26px;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #EEE5DA;
            border-color: #262424;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #262424;
        }

        /* Light Mode Styles */
        body.light-mode {
            background: #EEE5DA;
            color: #262424;
        }

        body.light-mode .container {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .logo-icon {
            background: #262424;
            color: #EEE5DA;
        }

        body.light-mode h1 {
            color: #262424;
        }

        body.light-mode .tagline {
            color: #666666;
        }

        body.light-mode .suggestion-card {
            background: #ffffff;
            border-color: #262424;
        }

        body.light-mode .suggestion-card:hover {
            border-color: #666666;
        }

        body.light-mode .decision-button {
            background: #262424;
            color: #EEE5DA;
        }

        body.light-mode .decision-button:hover {
            background: #666666;
            color: #EEE5DA;
        }

        body.light-mode .custom-input {
            background: #ffffff;
            border-color: #262424;
            color: #262424;
        }

        body.light-mode .custom-input::placeholder {
            color: #666666;
        }

        body.light-mode .filter-container {
            background: #ffffff;
            border-color: #262424;
        }

        body.light-mode .filter-button {
            background: #ffffff;
            border-color: #262424;
            color: #262424;
        }

        body.light-mode .filter-button:hover,
        body.light-mode .filter-button.active {
            background: #262424;
            color: #EEE5DA;
        }

        body.light-mode .filter-label {
            color: #666666;
        }

        body.light-mode .restaurant-card {
            background: #ffffff;
            border-color: #262424;
        }

        body.light-mode .restaurant-name {
            color: #262424;
        }

        body.light-mode .restaurant-details {
            color: #666666;
        }

        body.light-mode .restaurant-rating {
            color: #262424;
        }

        body.light-mode .restaurant-price {
            color: #666666;
        }

        body.light-mode .time-display {
            color: #666666;
        }

        body.light-mode .time-period {
            color: #262424;
        }

        /* Custom Decision UI Styles */
        .custom-decision-container {
            display: none;
            margin-top: 1rem;
            padding: 1.5rem;
            background: #2d2d2d;
            border-radius: 15px;
            border: 2px solid #EEE5DA;
            animation: slideDown 0.3s ease;
        }

        .custom-decision-container.visible {
            display: block;
        }

        .custom-decision-header {
            font-size: 1.2rem;
            color: #EEE5DA;
            margin-bottom: 1.5rem;
            font-weight: 500;
            text-align: center;
        }

        .decision-list {
            margin-bottom: 1.5rem;
        }

        .decision-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            padding: 0.8rem;
            background: #262424;
            border-radius: 10px;
            border: 1px solid #EEE5DA;
        }

        .decision-number {
            color: #b3a9a0;
            font-weight: 500;
            min-width: 30px;
        }

        .decision-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #EEE5DA;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            padding: 0.5rem;
        }

        .decision-input:focus {
            outline: none;
        }

        .remove-decision {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            padding: 0.5rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-decision {
            background: #EEE5DA;
            color: #262424;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            width: 100%;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .add-decision:hover {
            background: #b3a9a0;
            color: #EEE5DA;
        }

        .custom-decision-button {
            background: #EEE5DA;
            color: #262424;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.1rem;
        }

        .custom-decision-button:hover {
            background: #b3a9a0;
            color: #EEE5DA;
        }

        body.light-mode .custom-decision-container {
            background: #ffffff;
            border-color: #262424;
        }

        body.light-mode .decision-item {
            background: #f5f5f5;
            border-color: #262424;
        }

        body.light-mode .decision-input {
            color: #262424;
        }

        body.light-mode .add-decision {
            background: #262424;
            color: #EEE5DA;
        }

        body.light-mode .add-decision:hover {
            background: #666666;
            color: #EEE5DA;
        }

        body.light-mode .custom-decision-button {
            background: #262424;
            color: #EEE5DA;
        }

        body.light-mode .custom-decision-button:hover {
            background: #666666;
            color: #EEE5DA;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                margin-top: 80px;
            }

            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 0.9rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            .decision-button {
                padding: 0.8rem;
                font-size: 0.95rem;
            }

            .suggestion-card {
                padding: 1.5rem;
                min-height: 80px;
            }

            #decision-result {
                font-size: 1.5rem;
            }

            .filter-container {
                padding: 0.8rem;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }

            .filter-button {
                width: 100%;
                padding: 0.8rem;
            }

            .filter-label {
                display: block;
                margin-bottom: 0.5rem;
            }

            .custom-decision-container {
                padding: 1rem;
            }

            .decision-item {
                padding: 0.6rem;
            }

            .decision-input {
                font-size: 0.95rem;
            }

            .add-decision, .custom-decision-button {
                padding: 0.8rem;
                font-size: 0.95rem;
            }

            .restaurant-card {
                padding: 0.8rem;
            }

            .restaurant-name {
                font-size: 1.1rem;
            }

            .restaurant-details {
                font-size: 0.85rem;
            }

            .restaurant-rating {
                font-size: 0.9rem;
            }

            .restaurant-price {
                font-size: 0.85rem;
            }

            /* Adjust theme switch position for mobile */
            .theme-switch-wrapper {
                top: 10px;
                right: 10px;
            }

            .theme-switch {
                height: 30px;
                width: 50px;
            }

            .slider:before {
                height: 22px;
                width: 22px;
            }

            input:checked + .slider:before {
                transform: translateX(20px);
            }

            /* Improve touch targets */
            .remove-decision {
                padding: 0.8rem;
                font-size: 1.4rem;
            }

            /* Add bottom padding for better scrolling */
            .container {
                padding-bottom: 2rem;
            }

            /* Optimize time display for mobile */
            .time-display {
                font-size: 1rem;
                margin-bottom: 0.8rem;
            }

            .time-period {
                display: block;
                margin-top: 0.3rem;
            }

            /* Improve button touch targets */
            .decision-button, .filter-button, .location-button {
                min-height: 44px;
                touch-action: manipulation;
            }

            /* Add pull-to-refresh visual feedback */
            .container {
                overscroll-behavior-y: contain;
            }

            /* Optimize loading spinner for mobile */
            .loading {
                width: 30px;
                height: 30px;
                border-width: 3px;
            }
        }

        /* Small mobile devices */
        @media (max-width: 380px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .decision-button {
                padding: 0.7rem;
                font-size: 0.9rem;
            }

            #decision-result {
                font-size: 1.3rem;
            }
        }

        /* Landscape mode optimization */
        @media (max-height: 600px) and (orientation: landscape) {
            .container {
                margin: 40px auto;
                padding: 1rem;
            }

            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .suggestion-card {
                min-height: 60px;
                margin: 1rem 0;
            }

            #decision-result {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
        </label>
    </div>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">P</div>
            <h1>PickPal</h1>
        </div>
        <div class="time-display">
            <span id="current-time"></span>
            <span class="time-period" id="time-period"></span>
        </div>
        <div class="tagline">Your Decision Making Friend</div>
        <div class="suggestion-card">
            <div id="decision-result"></div>
        </div>
        <div class="loading" id="loading"></div>
        <div class="button-grid">
            <button class="decision-button" onclick="toggleFoodOptions()">What Should I Eat?</button>
            <button class="decision-button" onclick="makeDecision('yesno')">Yes or No?</button>
            <button class="decision-button" onclick="makeDecision('maybe')">Maybe?</button>
            <button class="decision-button" onclick="makeDecision('coin')">Flip a Coin</button>
            <button class="decision-button" onclick="makeDecision('dice')">Roll a Die</button>
            <button class="decision-button" onclick="makeDecision('custom')">Custom Decision</button>
        </div>
        <div class="food-options" id="food-options">
            <div class="filter-container" id="filter-container">
                <div class="filter-group">
                    <span class="filter-label">Diet:</span>
                    <button class="filter-button" onclick="toggleFilter('diet', 'all')" id="diet-all">All</button>
                    <button class="filter-button" onclick="toggleFilter('diet', 'veg')" id="diet-veg">Vegetarian</button>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Cuisine:</span>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'all')" id="cuisine-all">All</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'south')" id="cuisine-south">South Indian</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'north')" id="cuisine-north">North Indian</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'chinese')" id="cuisine-chinese">Chinese</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'american')" id="cuisine-american">American</button>
                </div>
                <div class="filter-group">
                    <button class="location-button" onclick="findNearbyRestaurants()">
                        <i class="fas fa-map-marker-alt"></i>
                        Find Nearby Restaurants
                    </button>
                </div>
            </div>
            <div id="restaurant-results"></div>
            <button class="decision-button" onclick="makeDecision('food')" style="margin-top: 1rem;">Get Food Suggestion</button>
        </div>
        <div class="custom-decision-container" id="custom-decision-container">
            <div class="custom-decision-header">Enter your options:</div>
            <div class="decision-list" id="decision-list">
                <div class="decision-item">
                    <span class="decision-number">1</span>
                    <input type="text" class="decision-input" placeholder="Enter first option">
                </div>
                <div class="decision-item">
                    <span class="decision-number">2</span>
                    <input type="text" class="decision-input" placeholder="Enter second option">
                </div>
            </div>
            <button class="add-decision" onclick="addDecisionInput()">+ Add Another Option</button>
            <button class="custom-decision-button" onclick="handleCustomDecision()">Make Decision!</button>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js"></script>
    <script>
        const foods = {
            breakfast: [
                // South Indian Breakfast
                { name: "Idli Sambar", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Mini Idlis with Sambar", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Ghee Podi Idli", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Thatte Idosi", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Onion Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Cheese Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Masala Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Rava Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Egg Dosa", category: "South Indian", diet: "non-veg", cuisine: "south" },
                // North Indian Breakfast
                { name: "Aloo Paratha", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Paneer Paratha", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Chole Bhature", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Kachori with Aloo Sabzi", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Samosa", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Pani Puri", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Egg Bhurji with Pav", category: "North Indian", diet: "non-veg", cuisine: "north" },
                { name: "Keema Paratha", category: "North Indian", diet: "non-veg", cuisine: "north" }

        const yesNoResponses = [
            { name: "Yes", category: "Definitely!" },
            { name: "No", category: "Not this time" },

        ];

            { name: "Probably", category: "Good chance" },

        ];

        let activeFilters = {
            diet: 'all',
            cuisine: 'all'

        function toggleFilter(type, value) {
            // Update active filters
            activeFilters[type] = value;
            
            // Update button styles
            document.querySelectorAll(`.filter-button[onclick*="${type}"]`).forEach(button => {
                button.classList.remove('active');
            });
            document.getElementById(`${type}-${value}`).classList.add('active');
        }

        function getFilteredFoods(mealType) {
            let foodOptions = foods[mealType];
            
            // Apply filters
            if (activeFilters.diet !== 'all') {
                foodOptions = foodOptions.filter(food => food.diet === activeFilters.diet);
            }
            if (activeFilters.cuisine !== 'all') {
                foodOptions = foodOptions.filter(food => food.cuisine === activeFilters.cuisine);
            }
            
            return foodOptions;
        }

        // Update time display
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            let period;
            if (hours >= 5 && hours < 12) {
                period = "Breakfast Time";
            } else if (hours >= 12 && hours < 16) {
                period = "Lunch Time";
            } else if (hours >= 16 && hours < 22) {
                period = "Dinner Time";
            } else {
                period = "Snack Time";
            }

            document.getElementById('current-time').textContent = timeString;
            document.getElementById('time-period').textContent = period;
        }

        // Update time every second
        updateTime();
        setInterval(updateTime, 1000);

        function getCurrentMealType() {
            const hours = new Date().getHours();
            if (hours >= 5 && hours < 12) return 'breakfast';
            if (hours >= 12 && hours < 16) return 'lunch';
            if (hours >= 16 && hours < 22) return 'dinner';
            return 'snack';
        }

        function makeDecision(type) {
            const resultElement = document.getElementById("decision-result");
            const loadingElement = document.getElementById("loading");
            const foodOptions = document.getElementById("food-options");
            const customDecisionContainer = document.getElementById("custom-decision-container");
            
            // Close other menus first
            if (type !== 'food') {
                foodOptions.classList.remove("visible");
                document.getElementById("filter-container").style.display = "none";
                resetFilters();
            }
            
            if (type !== 'custom') {
                customDecisionContainer.classList.remove("visible");
            }
            
            resultElement.classList.remove("visible");
            loadingElement.style.display = "block";
            
            if (type === 'custom') {
                customDecisionContainer.classList.add("visible");
                loadingElement.style.display = "none";
                return;
            }
            
            setTimeout(() => {
                let result;
                switch(type) {
                    case 'food':
                        const mealType = getCurrentMealType();
                        const foodOptions = getFilteredFoods(mealType);
                        if (foodOptions.length === 0) {
                            result = {
                                name: "No options available",
                                category: "Try different filters"
                            };
                        } else {
                            result = foodOptions[Math.floor(Math.random() * foodOptions.length)];
                        }
                        break;
                    case 'yesno':
                        result = yesNoResponses[Math.floor(Math.random() * yesNoResponses.length)];
                        break;
                    case 'maybe':
                        result = maybeResponses[Math.floor(Math.random() * maybeResponses.length)];
                        break;
                    case 'coin':
                        result = {
                            name: Math.random() < 0.5 ? "Heads" : "Tails",
                            category: "Coin Flip"
                        };
                        break;
                    case 'dice':
                        result = {
                            name: Math.floor(Math.random() * 6) + 1,
                            category: "Dice Roll"
                        };
                        break;
                }
                
                resultElement.innerHTML = `
                    ${result.name}
                    <div class="decision-category">${result.category}</div>
                `;
                
                loadingElement.style.display = "none";
                resultElement.classList.add("visible");
            }, 800);
        }

        function addDecisionInput() {
            const decisionList = document.getElementById("decision-list");
            const newNumber = decisionList.children.length + 1;
            
            const newDecision = document.createElement("div");
            newDecision.className = "decision-item";
            newDecision.innerHTML = `
                <span class="decision-number">${newNumber}</span>
                <input type="text" class="decision-input" placeholder="Enter option ${newNumber}">
                <button class="remove-decision" onclick="removeDecision(this)">×</button>
            `;
            
            decisionList.appendChild(newDecision);
        }

        function removeDecision(button) {
            const decisionItem = button.parentElement;
            const decisionList = decisionItem.parentElement;
            decisionList.removeChild(decisionItem);
            
            // Update numbers
            const decisions = decisionList.getElementsByClassName("decision-item");
            for (let i = 0; i < decisions.length; i++) {
                decisions[i].querySelector(".decision-number").textContent = i + 1;
            }
        }

        function handleCustomDecision() {
            const decisionInputs = document.getElementsByClassName("decision-input");
            const options = Array.from(decisionInputs)
                .map(input => input.value.trim())
                .filter(value => value !== "");
            
            if (options.length > 0) {
                const randomOption = options[Math.floor(Math.random() * options.length)];
                document.getElementById("decision-result").innerHTML = `
                    ${randomOption}
                    <div class="decision-category">Custom Decision</div>
                `;
                document.getElementById("decision-result").classList.add("visible");
                document.getElementById("custom-decision-container").classList.remove("visible");
                
                // Reset inputs
                Array.from(decisionInputs).forEach(input => input.value = "");
            }
        }

            const foodOptions = document.getElementById('food-options');
            const filterContainer = document.getElementById('filter-container');
            const foodButton = document.querySelector('.decision-button');
            
            // Toggle food options visibility
            foodOptions.classList.toggle('visible');
            filterContainer.style.display = foodOptions.classList.contains('visible') ? 'flex' : 'none';
            foodButton.classList.toggle('active');
            
            // Reset filters when hiding
            if (!foodOptions.classList.contains('visible')) {
                resetFilters();
            }

        function resetFilters() {
            activeFilters = {
                diet: 'all',
                cuisine: 'all'
            };
            
            // Reset all filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Set 'All' buttons as active
            document.getElementById('diet-all').classList.add('active');
            document.getElementById('cuisine-all').classList.add('active');
        }

        // Add these variables at the top of your script
        let userLocation = null;
        const ZOMATO_API_KEY = 'YOUR_ZOMATO_API_KEY'; // You'll need to get this from Zomato API

        // Add these new functions
        function findNearbyRestaurants() {
            const resultElement = document.getElementById("restaurant-results");
            resultElement.innerHTML = '<div class="loading" id="loading"></div>';
            
            // Check if Zomato API key is set
            if (ZOMATO_API_KEY === 'YOUR_ZOMATO_API_KEY') {
                resultElement.innerHTML = `
                    <div class="location-error">
                        API key not configured. Please contact the administrator.
                    </div>
                `;
                return;
            }

            if (!userLocation) {
                getLocation()
                    .then(location => {
                        userLocation = location;
                        fetchNearbyRestaurants(location);
                    })
                    .catch(error => {
                        resultElement.innerHTML = `
                            <div class="location-error">
                                Unable to get location. Please enable location access or try again.
                                <br>
                                <small>Error: ${error.message}</small>
                            </div>
                        `;
                    });
            } else {
                fetchNearbyRestaurants(userLocation);
            }
        }

        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation is not supported by your browser'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    position => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        });
                    },
                    error => {
                        reject(error);
                    }
                );
            });
        }

        async function fetchNearbyRestaurants(location) {
            const resultElement = document.getElementById("restaurant-results");
            const mealType = getCurrentMealType();
            const cuisine = getCuisineFromFilters();
            
            try {
                // First, get the city ID
                const cityResponse = await fetch(`https://developers.zomato.com/api/v2.1/cities?lat=${location.latitude}&lon=${location.longitude}`, {
                    headers: {
                        'user-key': ZOMATO_API_KEY,
                        'Accept': 'application/json'
                    }
                });

                if (!cityResponse.ok) {
                    throw new Error(`City API error: ${cityResponse.status}`);
                }

                const cityData = await cityResponse.json();
                if (!cityData.location_suggestions || cityData.location_suggestions.length === 0) {
                    throw new Error('No city found for this location');
                }

                const cityId = cityData.location_suggestions[0].id;

                // Then search for restaurants
                const searchParams = new URLSearchParams({
                    entity_id: cityId,
                    entity_type: 'city',
                    count: '5',
                    sort: 'rating',
                    order: 'desc'
                });

                if (cuisine) {
                    searchParams.append('cuisines', cuisine);
                }

                const response = await fetch(`https://developers.zomato.com/api/v2.1/search?${searchParams}`, {
                    headers: {
                        'user-key': ZOMATO_API_KEY,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Restaurant API error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.restaurants && data.restaurants.length > 0) {
                    const restaurants = data.restaurants.map(restaurant => restaurant.restaurant);
                    displayRestaurants(restaurants);
                } else {
                    resultElement.innerHTML = `
                        <div class="location-error">
                            No restaurants found nearby. Try different filters or location.
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error fetching restaurants:', error);
                resultElement.innerHTML = `
                    <div class="location-error">
                        Error fetching restaurants. Please try again later.
                        <br>
                        <small>Error: ${error.message}</small>
                    </div>
                `;
            }
        }

        function displayRestaurants(restaurants) {
            const resultElement = document.getElementById("restaurant-results");
            resultElement.innerHTML = restaurants.map(restaurant => `
                <div class="restaurant-card">
                    <div class="restaurant-name">${restaurant.name}</div>
                    <div class="restaurant-details">
                        ${restaurant.location.address}
                        ${restaurant.location.locality ? `<br>${restaurant.location.locality}` : ''}
                    </div>
                    <div class="restaurant-rating">
                        Rating: ${restaurant.user_rating.aggregate_rating}/5
                        (${restaurant.user_rating.votes} votes)
                    </div>
                    <div class="restaurant-price">
                        Price for two: ₹${restaurant.average_cost_for_two}
                        ${restaurant.price_range ? `<br>Price Range: ${restaurant.price_range}/4` : ''}
                    </div>
                    <div class="restaurant-features">
                        ${restaurant.has_online_delivery ? '🛵 Online Delivery' : ''}
                        ${restaurant.has_table_booking ? '🍽️ Table Booking' : ''}
                    </div>
                    <a href="${restaurant.url}" target="_blank" class="decision-button" style="margin-top: 0.5rem; display: inline-block; text-decoration: none;">
                        View Menu
                    </a>
                </div>
            `).join('');
        }

        function getCuisineFromFilters() {
            // Map our cuisine filters to Zomato cuisine IDs
            const cuisineMap = {
                'south': '308', // South Indian
                'north': '148', // North Indian
                'chinese': '25', // Chinese
                'american': '1'  // American
            };
            
            return activeFilters.cuisine === 'all' ? '' : cuisineMap[activeFilters.cuisine] || '';
        }

        // Add this at the beginning of your script section
        const themeSwitch = document.getElementById('checkbox');
        
        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeSwitch.checked = true;
        }

        // Theme switch event listener
        themeSwitch.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        });
