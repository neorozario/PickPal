<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickPal - Your Decision Making Friend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #262424;
            color: #EEE5DA;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: #EEE5DA;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 24px;
            font-weight: bold;
            color: #262424;
            transform: rotate(-5deg);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #EEE5DA;
        }

        .tagline {
            color: #b3a9a0;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .suggestion-card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            border: 2px solid #EEE5DA;
        }

        .suggestion-card:hover {
            transform: translateY(-5px);
            border-color: #b3a9a0;
        }

        #decision-result {
            font-size: 2rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            color: #EEE5DA;
        }

        #decision-result.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .decision-button {
            background: #EEE5DA;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            color: #262424;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .decision-button:hover {
            transform: translateY(-2px);
            background: #b3a9a0;
            color: #EEE5DA;
        }

        .decision-button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #2d2d2d;
            border-top: 4px solid #EEE5DA;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .decision-category {
            font-size: 0.9rem;
            color: #b3a9a0;
            margin-top: 0.5rem;
        }

        .custom-input {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.8rem;
            border-radius: 10px;
            color: #EEE5DA;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            margin-top: 1rem;
            text-align: center;
        }

        .custom-input::placeholder {
            color: #b3a9a0;
        }

        .custom-input:focus {
            outline: none;
            border-color: #b3a9a0;
        }

        .time-display {
            font-size: 1.2rem;
            color: #b3a9a0;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .time-period {
            color: #EEE5DA;
            font-weight: 600;
        }

        .filter-container {
            display: none;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin: 1rem 0;
            padding: 1rem;
            background: #2d2d2d;
            border-radius: 15px;
            border: 2px solid #EEE5DA;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }

        .filter-button {
            background: #2d2d2d;
            border: 2px solid #EEE5DA;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: #EEE5DA;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-button:hover {
            background: #EEE5DA;
            color: #262424;
        }

        .filter-button.active {
            background: #EEE5DA;
            color: #262424;
        }

        .filter-label {
            color: #b3a9a0;
            font-size: 0.9rem;
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .food-options {
            display: none;
            margin-top: 1rem;
        }

        .food-options.visible {
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .decision-button {
            position: relative;
        }

        .decision-button.active {
            background: #b3a9a0;
            color: #EEE5DA;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">P</div>
            <h1>PickPal</h1>
        </div>
        <div class="time-display">
            <span id="current-time"></span>
            <span class="time-period" id="time-period"></span>
        </div>
        <div class="tagline">Your Decision Making Friend</div>
        <div class="suggestion-card">
            <div id="decision-result"></div>
        </div>
        <div class="loading" id="loading"></div>
        <div class="button-grid">
            <button class="decision-button" onclick="toggleFoodOptions()">What Should I Eat?</button>
            <button class="decision-button" onclick="makeDecision('yesno')">Yes or No?</button>
            <button class="decision-button" onclick="makeDecision('maybe')">Maybe?</button>
            <button class="decision-button" onclick="makeDecision('coin')">Flip a Coin</button>
            <button class="decision-button" onclick="makeDecision('dice')">Roll a Die</button>
            <button class="decision-button" onclick="makeDecision('custom')">Custom Decision</button>
        </div>
        <div class="food-options" id="food-options">
            <div class="filter-container" id="filter-container">
                <div class="filter-group">
                    <span class="filter-label">Diet:</span>
                    <button class="filter-button" onclick="toggleFilter('diet', 'all')" id="diet-all">All</button>
                    <button class="filter-button" onclick="toggleFilter('diet', 'veg')" id="diet-veg">Vegetarian</button>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Cuisine:</span>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'all')" id="cuisine-all">All</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'south')" id="cuisine-south">South Indian</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'north')" id="cuisine-north">North Indian</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'chinese')" id="cuisine-chinese">Chinese</button>
                    <button class="filter-button" onclick="toggleFilter('cuisine', 'american')" id="cuisine-american">American</button>
                </div>
            </div>
            <button class="decision-button" onclick="makeDecision('food')" style="margin-top: 1rem;">Get Food Suggestion</button>
        </div>
        <input type="text" id="custom-options" class="custom-input" placeholder="Enter options separated by commas" style="display: none;">
    </div>

    <script>
        const foods = {
            breakfast: [
                { name: "Idli Sambar", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Upma", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Pongal", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Appam", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Paratha", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Pancakes", category: "American", diet: "veg", cuisine: "american" },
                { name: "Waffles", category: "American", diet: "veg", cuisine: "american" },
                { name: "Dim Sum", category: "Chinese", diet: "non-veg", cuisine: "chinese" }
            ],
            lunch: [
                { name: "Masala Dosa", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Butter Chicken", category: "North Indian", diet: "non-veg", cuisine: "north" },
                { name: "Dal Makhani", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Paneer Tikka", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Fried Rice", category: "Chinese", diet: "non-veg", cuisine: "chinese" },
                { name: "Chow Mein", category: "Chinese", diet: "non-veg", cuisine: "chinese" },
                { name: "Spring Rolls", category: "Chinese", diet: "veg", cuisine: "chinese" },
                { name: "Mac and Cheese", category: "American", diet: "veg", cuisine: "american" }
            ],
            dinner: [
                { name: "Biryani", category: "North Indian", diet: "non-veg", cuisine: "north" },
                { name: "Tandoori Roti", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Rajma Chawal", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Chole Bhature", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Kung Pao Chicken", category: "Chinese", diet: "non-veg", cuisine: "chinese" },
                { name: "Mapo Tofu", category: "Chinese", diet: "veg", cuisine: "chinese" },
                { name: "BBQ Ribs", category: "American", diet: "non-veg", cuisine: "american" },
                { name: "Clam Chowder", category: "American", diet: "non-veg", cuisine: "american" }
            ],
            snack: [
                { name: "Vada", category: "South Indian", diet: "veg", cuisine: "south" },
                { name: "Samosa", category: "North Indian", diet: "veg", cuisine: "north" },
                { name: "Wontons", category: "Chinese", diet: "non-veg", cuisine: "chinese" },
                { name: "French Fries", category: "Fast Food", diet: "veg", cuisine: "american" },
                { name: "Chicken Nuggets", category: "Fast Food", diet: "non-veg", cuisine: "american" },
                { name: "Onion Rings", category: "Fast Food", diet: "veg", cuisine: "american" },
                { name: "Ice Cream", category: "Fast Food", diet: "veg", cuisine: "american" },
                { name: "Pizza", category: "Fast Food", diet: "veg", cuisine: "american" }
            ]
        };

        const yesNoResponses = [
            { name: "Yes", category: "Definitely!" },
            { name: "No", category: "Not this time" },
            { name: "Maybe", category: "Think about it" }
        ];

        const maybeResponses = [
            { name: "Probably", category: "Good chance" },
            { name: "Probably Not", category: "Unlikely" },
            { name: "Maybe", category: "50/50" }
        ];

        let activeFilters = {
            diet: 'all',
            cuisine: 'all'
        };

        function toggleFilter(type, value) {
            // Update active filters
            activeFilters[type] = value;
            
            // Update button styles
            document.querySelectorAll(`.filter-button[onclick*="${type}"]`).forEach(button => {
                button.classList.remove('active');
            });
            document.getElementById(`${type}-${value}`).classList.add('active');
        }

        function getFilteredFoods(mealType) {
            let foodOptions = foods[mealType];
            
            // Apply filters
            if (activeFilters.diet !== 'all') {
                foodOptions = foodOptions.filter(food => food.diet === activeFilters.diet);
            }
            if (activeFilters.cuisine !== 'all') {
                foodOptions = foodOptions.filter(food => food.cuisine === activeFilters.cuisine);
            }
            
            return foodOptions;
        }

        // Update time display
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            let period;
            if (hours >= 5 && hours < 12) {
                period = "Breakfast Time";
            } else if (hours >= 12 && hours < 16) {
                period = "Lunch Time";
            } else if (hours >= 16 && hours < 22) {
                period = "Dinner Time";
            } else {
                period = "Snack Time";
            }

            document.getElementById('current-time').textContent = timeString;
            document.getElementById('time-period').textContent = period;
        }

        // Update time every second
        updateTime();
        setInterval(updateTime, 1000);

        function getCurrentMealType() {
            const hours = new Date().getHours();
            if (hours >= 5 && hours < 12) return 'breakfast';
            if (hours >= 12 && hours < 16) return 'lunch';
            if (hours >= 16 && hours < 22) return 'dinner';
            return 'snack';
        }

        function makeDecision(type) {
            const resultElement = document.getElementById("decision-result");
            const loadingElement = document.getElementById("loading");
            const customInput = document.getElementById("custom-options");
            
            resultElement.classList.remove("visible");
            loadingElement.style.display = "block";
            
            if (type === 'custom') {
                customInput.style.display = "block";
                loadingElement.style.display = "none";
                return;
            }
            
            setTimeout(() => {
                let result;
                switch(type) {
                    case 'food':
                        const mealType = getCurrentMealType();
                        const foodOptions = getFilteredFoods(mealType);
                        if (foodOptions.length === 0) {
                            result = {
                                name: "No options available",
                                category: "Try different filters"
                            };
                        } else {
                            result = foodOptions[Math.floor(Math.random() * foodOptions.length)];
                        }
                        break;
                    case 'yesno':
                        result = yesNoResponses[Math.floor(Math.random() * yesNoResponses.length)];
                        break;
                    case 'maybe':
                        result = maybeResponses[Math.floor(Math.random() * maybeResponses.length)];
                        break;
                    case 'coin':
                        result = {
                            name: Math.random() < 0.5 ? "Heads" : "Tails",
                            category: "Coin Flip"
                        };
                        break;
                    case 'dice':
                        result = {
                            name: Math.floor(Math.random() * 6) + 1,
                            category: "Dice Roll"
                        };
                        break;
                }
                
                resultElement.innerHTML = `
                    ${result.name}
                    <div class="decision-category">${result.category}</div>
                `;
                
                loadingElement.style.display = "none";
                resultElement.classList.add("visible");
            }, 800);
        }

        // Handle custom decision input
        document.getElementById("custom-options").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                const options = this.value.split(",").map(opt => opt.trim()).filter(opt => opt);
                if (options.length > 0) {
                    const randomOption = options[Math.floor(Math.random() * options.length)];
                    document.getElementById("decision-result").innerHTML = `
                        ${randomOption}
                        <div class="decision-category">Custom Decision</div>
                    `;
                    document.getElementById("decision-result").classList.add("visible");
                    this.style.display = "none";
                    this.value = "";
                }
            }
        });

        function toggleFoodOptions() {
            const foodOptions = document.getElementById('food-options');
            const filterContainer = document.getElementById('filter-container');
            const foodButton = document.querySelector('.decision-button');
            
            // Toggle food options visibility
            foodOptions.classList.toggle('visible');
            filterContainer.style.display = foodOptions.classList.contains('visible') ? 'flex' : 'none';
            foodButton.classList.toggle('active');
            
            // Reset filters when hiding
            if (!foodOptions.classList.contains('visible')) {
                resetFilters();
            }
        }

        function resetFilters() {
            activeFilters = {
                diet: 'all',
                cuisine: 'all'
            };
            
            // Reset all filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Set 'All' buttons as active
            document.getElementById('diet-all').classList.add('active');
            document.getElementById('cuisine-all').classList.add('active');
        }
    </script>
</body>
</html>
